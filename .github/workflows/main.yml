name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: chmod +x gradlew
      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck
      - name: Build and test
        run: ./gradlew build

  # Tuning mode lets dashboards change robot values; main must never have it on.
  tuning-mode:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: TUNING_MODE is false
        run: grep -Eq '^ *public static final boolean TUNING_MODE = false;' src/main/java/frc/robot/RunMode.java

  # No CTRE swerve API anywhere: our swerve is our own.
  no-ctre-swerve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No com.ctre.phoenix6.swerve imports
        run: "! grep -rn 'com\.ctre\.phoenix6\.swerve' src"
